<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Group - ShareAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="neon-text">Join Group</h1>
    <form id="joinForm">
        <input type="text" name="inviteCode" placeholder="Invite Code" required><br>
        <button type="submit" class="btn-primary">Join</button>
    </form>
    <script>
    document.getElementById('joinForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        const form=e.target;
        const res=await fetch('../api/join_group.php',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({inviteCode:form.inviteCode.value})
        });
        const data=await res.json();
        if(data.status==='ok') alert('Joined group');
        else alert(data.error);
    });
    </script>
</body>
</html>
