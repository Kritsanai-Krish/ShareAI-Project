<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ShareAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="neon-text">Your Groups</h1>
    <div id="groups"></div>
    <script>
    async function load(){
        const res=await fetch('../api/get_dashboard.php');
        if(res.status!==200){alert('Not logged in');return;}
        const data=await res.json();
        const container=document.getElementById('groups');
        data.groups.forEach(g=>{
            const div=document.createElement('div');
            div.innerHTML=`<h3>${g.group.aiService}</h3>Payment status: ${g.payment.status} <a href="group.html?g=${g.group._id}">Enter</a>`;
            container.appendChild(div);
        });
    }
    load();
    </script>
</body>
</html>
